name: best-local

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env file}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    init: true
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.10.1-alpine
    command: ['redis-server', '--appendonly', 'yes', '--loglevel', 'warning']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    restart: unless-stopped
    stop_grace_period: 10s
    volumes:
      - redis-data:/data

  object-storage:
    image: chrislusf/seaweedfs:4.45
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in the root .env file}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in the root .env file}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in the root .env file}
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '--spider',
          'http://127.0.0.1:9333/cluster/status',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    init: true
    ports:
      - '127.0.0.1:8333:8333'
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - object-storage-data:/data

  malware-scanner:
    image: clamav/clamav:1.5.3_base
    init: true
    ports:
      - '127.0.0.1:${CLAMAV_PORT:-3310}:3310'
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - clamav-signatures:/var/lib/clamav

  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_MAX_MESSAGES: 500
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped
    stop_grace_period: 10s

volumes:
  clamav-signatures:
  object-storage-data:
  postgres-data:
  redis-data:
