# Only BEST's container loads this file. Shared Caddy is unchanged.
map $http_origin $best_origin_allowed {
    default 0;
    "" 1;
    "https://201.18.217.140:3102" 1;
}

# Do not log query strings: S3 query parameters contain short-lived credentials.
log_format best '$remote_addr - $request_method $uri $status $body_bytes_sent';
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    server_name 201.18.217.140;
    if ($host != "201.18.217.140") { return 444; }
    ssl_certificate /etc/letsencrypt/live/bestlc-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bestlc-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BEST:10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/access.log best;
    # Nginx error messages can contain signed request URLs; do not persist them.
    error_log /dev/null;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    set $best_api http://api:4000;
    set $best_web http://web:3000;
    set $best_storage http://object-storage:8333;

    location = /best-api/graphql {
        if ($best_origin_allowed = 0) { return 403; }
        proxy_pass $best_api/graphql$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 2700s;
    }

    # Preserve signed path and Host, including :3102. Never strip this prefix.
    location ^~ /best-private/ {
        if ($best_origin_allowed = 0) { return 403; }
        limit_except GET PUT { deny all; }
        client_max_body_size 50m;
        proxy_pass $best_storage$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie "";
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
    }

    location / {
        if ($best_origin_allowed = 0) { return 403; }
        proxy_pass $best_web$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3102;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_read_timeout 300s;
    }
}
